<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Залы</title>
    <link rel="stylesheet" href="style/gyms.css">
</head>
<body>
<header>
    <div class="header-container">
        <div class="logo">FlexClub</div>
        <ul class="nav-menu">
            <li><a href="gyms.html">Залы</a></li>
            <li><a href="subscription.html">Абонемент</a></li>
            <li><a href="coaches.html">Тренера</a></li>
            <li><a href="about.html">О нас</a></li>
            <li><button class="login-btn">Войти</button></li>
        </ul>
    </div>
</header>

<section class="branches-banner-section container">
    <div class="branches-banner-container">
        <h2 class="branches-banner-title">Наши залы</h2>
        <p class="branches-banner-subtitle">Выберите филиал:</p>

        <div class="branches-banner-switcher">
            <label class="branch-radio-banner active">
                <input type="radio" value="altayskaya" checked>
                <span>Алтайская 159/3</span>
            </label>
            <label class="branch-radio-banner">
                <input type="radio" value="kievskaya">
                <span>ул. Киевская 139</span>
            </label>
        </div>
    </div>
</section>

<section class="map-section">
    <div class="container">
        <h2 class="section-title map-title">Мы на карте</h2>

        <div class="map-card">
            <img src="images/gyms/map.png" alt="Карта филиалов FlexClub в Томске" class="map-image">
        </div>
    </div>
</section>
<section class="gallery-section">

    <h2 class="section-title">Галерея</h2>

    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="images/gyms/gallery-1.png" alt="Фото" class="service-image">
        </div>

        <div class="gallery-item">
            <img src="images/gyms/gallery-2.png" alt="Фото" class="service-image">
        </div>

        <div class="gallery-item">
            <img src="images/gyms/gallery-3.png" alt="Фото" class="service-image">
        </div>

        <div class="gallery-item">
            <img src="images/gyms/gallery-4.png" alt="Фото" class="service-image">
        </div>

        <div class="gallery-item">
            <img src="images/gyms/gallery-5.png" alt="Фото" class="service-image">
        </div>

        <div class="gallery-item">
            <img src="images/gyms/gallery-6.png" alt="Фото" class="service-image">
        </div>
    </div>
</section>
<footer class="footer">
    <div class="container">
        <div class="footer-top">
            <div class="footer-logo-column">
                <div class="footer-logo">FlexClub</div>
                <div class="footer-subtitle">Тренажерные залы в Томске</div>
            </div>

            <nav class="footer-nav">
                <a href="coaches.html">Тренера</a>
                <a href="subscription.html">Абонемент</a>
                <a href="about.html">О нас</a>
                <a href="cabinet.html">Личный кабинет</a>
                <a href="gyms.html">Залы</a>
            </nav>

            <div class="footer-social">
                <a href="https://ok.ru/" class="social-icon" aria-label="Одноклассники">
                    <img src="images/svg/odnoklassniki.svg" alt="Одноклассники">
                </a>
                <a href="https://vk.com/" class="social-icon" aria-label="ВКонтакте">
                    <img src="images/svg/vk.svg" alt="ВКонтакте">
                </a>
                <a href="https://max.ru/" class="social-icon" aria-label="MAX">
                    <img src="images/svg/max.svg" alt="MAX">
                </a>
            </div>
        </div>

        <div class="footer-divider"></div>

        <div class="footer-bottom">
            <div class="copyright">
                Copyright 2025–2025 Тренажерный зал FlexClub
            </div>
            <div class="privacy-link">
                <a href="#">Политика конфиденциальности</a>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
